name: ci

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: turbo
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=--filter=...[${{ github.event.pull_request.base.sha }}]" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "value=--filter=...[${{ github.event.before }}]" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm turbo run lint ${{ steps.turbo.outputs.value }}

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: turbo
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=--filter=...[${{ github.event.pull_request.base.sha }}]" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "value=--filter=...[${{ github.event.before }}]" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm turbo run typecheck ${{ steps.turbo.outputs.value }}

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: turbo
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=--filter=...[${{ github.event.pull_request.base.sha }}]" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "value=--filter=...[${{ github.event.before }}]" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm turbo run test ${{ steps.turbo.outputs.value }}

  payment-reconciliation-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: reconciler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@lattelink/payment-reconciler-worker...' build
      - run: pnpm --filter @lattelink/payment-reconciler-worker test
        env:
          RECONCILER_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/reconciler_test

  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@lattelink/contracts-*
      - name: verify contract compatibility and generation drift
        run: pnpm contracts:drift

  release-policy:
    name: release-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm test:release-policy

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: turbo
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=--filter=...[${{ github.event.pull_request.base.sha }}]" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "value=--filter=...[${{ github.event.before }}]" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm turbo run build ${{ steps.turbo.outputs.value }}
      - uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            apps/mobile/build
            services/*/dist
          if-no-files-found: ignore

  terraform-validate:
    name: terraform-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=infra/terraform fmt -recursive -check
      - run: terraform -chdir=infra/terraform/envs/dev init -backend=false
      - run: terraform -chdir=infra/terraform/envs/dev validate
      - run: terraform -chdir=infra/terraform/envs/staging init -backend=false
      - run: terraform -chdir=infra/terraform/envs/staging validate
      - run: terraform -chdir=infra/terraform/envs/prod init -backend=false
      - run: terraform -chdir=infra/terraform/envs/prod validate
