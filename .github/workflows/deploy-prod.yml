name: deploy-prod
run-name: >-
  deploy-prod
  ${{ github.event_name == 'release' && github.event.release.tag_name || 'rollback' }}
  ${{ github.event_name == 'release' && github.event.release.target_commitish || inputs.image_tag }}

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full published Git SHA to roll back production
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.image_tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate production deployment policy
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          APP_VERSION_FALLBACK: ${{ vars.APP_VERSION }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          git fetch --force origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"

          if [ "${EVENT_NAME}" = "release" ]; then
            if [ -z "${RELEASE_TAG:-}" ]; then
              echo "Release event did not include a tag name." >&2
              exit 1
            fi

            target_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            previous_release_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Fxv "${RELEASE_TAG}" | head -n 1 || true)"

            TARGET_SHA="${target_sha}" \
              MAIN_SHA="${main_sha}" \
              PREVIOUS_RELEASE_TAG="${previous_release_tag}" \
              node scripts/validate-production-release.mjs

            {
              echo "release_tag=${RELEASE_TAG}"
              echo "app_version=${RELEASE_TAG#v}"
              echo "target_sha=${target_sha}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s' "${DISPATCH_IMAGE_TAG}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Rollback image_tag must be a full 40-character git SHA." >&2
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${DISPATCH_IMAGE_TAG}" ]; then
            echo "Checked out ${actual_sha}, but workflow input requested ${DISPATCH_IMAGE_TAG}." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${DISPATCH_IMAGE_TAG}" refs/remotes/origin/main; then
            echo "Rollback SHA ${DISPATCH_IMAGE_TAG} must already be on origin/main before deployment." >&2
            exit 1
          fi

          {
            echo "release_tag="
            echo "app_version=${APP_VERSION_FALLBACK:-unknown}"
            echo "target_sha=${DISPATCH_IMAGE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Check deploy prerequisites
        id: deploy-check
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.EXPECTED_SUPABASE_PROJECT_REF }}
          GATEWAY_INTERNAL_API_TOKEN: ${{ secrets.GATEWAY_INTERNAL_API_TOKEN }}
          ORDERS_INTERNAL_API_TOKEN: ${{ secrets.ORDERS_INTERNAL_API_TOKEN }}
          LOYALTY_INTERNAL_API_TOKEN: ${{ secrets.LOYALTY_INTERNAL_API_TOKEN }}
          NOTIFICATIONS_INTERNAL_API_TOKEN: ${{ secrets.NOTIFICATIONS_INTERNAL_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_ALLOWED_CLIENT_IDS: ${{ vars.APPLE_ALLOWED_CLIENT_IDS }}
          APPLE_SIGN_IN_ENABLED: ${{ vars.APPLE_SIGN_IN_ENABLED }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          IMAGE_REGISTRY_PREFIX: ${{ vars.IMAGE_REGISTRY_PREFIX }}
          ALLOW_DEV_CUSTOMER_LOGIN: ${{ vars.ALLOW_DEV_CUSTOMER_LOGIN }}
          PAYMENTS_PROVIDER_MODE: ${{ vars.PAYMENTS_PROVIDER_MODE }}
          CLOVER_OAUTH_ENVIRONMENT: ${{ vars.CLOVER_OAUTH_ENVIRONMENT }}
          CLOVER_APP_ID: ${{ secrets.CLOVER_APP_ID }}
          CLOVER_APP_SECRET: ${{ secrets.CLOVER_APP_SECRET }}
          CLOVER_OAUTH_REDIRECT_URI: ${{ secrets.CLOVER_OAUTH_REDIRECT_URI }}
          CLOVER_OAUTH_STATE_SECRET: ${{ secrets.CLOVER_OAUTH_STATE_SECRET }}
          CLOVER_WEBHOOK_SHARED_SECRET: ${{ secrets.CLOVER_WEBHOOK_SHARED_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
          CATALOG_MEDIA_R2_ACCOUNT_ID: ${{ vars.CATALOG_MEDIA_R2_ACCOUNT_ID }}
          CATALOG_MEDIA_R2_ACCESS_KEY_ID: ${{ secrets.CATALOG_MEDIA_R2_ACCESS_KEY_ID }}
          CATALOG_MEDIA_R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOG_MEDIA_R2_SECRET_ACCESS_KEY }}
          CATALOG_MEDIA_R2_BUCKET: ${{ vars.CATALOG_MEDIA_R2_BUCKET }}
          CATALOG_MEDIA_PUBLIC_BASE_URL: ${{ vars.CATALOG_MEDIA_PUBLIC_BASE_URL }}
          CATALOG_MEDIA_UPLOAD_MAX_BYTES: ${{ vars.CATALOG_MEDIA_UPLOAD_MAX_BYTES }}
          CATALOG_MEDIA_UPLOAD_EXPIRY_SECONDS: ${{ vars.CATALOG_MEDIA_UPLOAD_EXPIRY_SECONDS }}
        run: |
          if [ "${DEPLOY_ENABLED:-false}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping production deploy because DEPLOY_ENABLED is not true for this environment."
            exit 0
          fi

          missing=0
          for required in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY GATEWAY_INTERNAL_API_TOKEN ORDERS_INTERNAL_API_TOKEN LOYALTY_INTERNAL_API_TOKEN NOTIFICATIONS_INTERNAL_API_TOKEN JWT_SECRET LETSENCRYPT_EMAIL API_DOMAIN IMAGE_REGISTRY_PREFIX EXPECTED_SUPABASE_PROJECT_REF; do
            if [ -z "${!required}" ]; then
              echo "missing: ${required}"
              missing=1
            fi
          done

          if [ -z "${DATABASE_URL_SECRET:-}" ]; then
            echo "missing: provide DATABASE_URL"
            missing=1
          elif ! printf '%s' "${DATABASE_URL_SECRET}" | grep -Fq "${EXPECTED_SUPABASE_PROJECT_REF}"; then
            echo "DATABASE_URL does not match EXPECTED_SUPABASE_PROJECT_REF for production"
            missing=1
          fi

          if [ "${APPLE_SIGN_IN_ENABLED:-false}" = "true" ]; then
            for required in APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY; do
              if [ -z "${!required:-}" ]; then
                echo "missing for Apple Sign In: ${required}"
                missing=1
              fi
            done

            if [ -z "${APPLE_ALLOWED_CLIENT_IDS:-}" ]; then
              echo "missing for Apple Sign In: provide APPLE_ALLOWED_CLIENT_IDS"
              missing=1
            fi
          fi

          if [ "${PAYMENTS_PROVIDER_MODE:-simulated}" = "live" ]; then
            if [ -z "${CLOVER_WEBHOOK_SHARED_SECRET:-}" ]; then
              echo "missing for live Clover deploy: CLOVER_WEBHOOK_SHARED_SECRET"
              missing=1
            fi

            has_oauth_bootstrap=1
            for required in CLOVER_APP_ID CLOVER_APP_SECRET CLOVER_OAUTH_REDIRECT_URI CLOVER_OAUTH_STATE_SECRET; do
              if [ -z "${!required:-}" ]; then
                has_oauth_bootstrap=0
              fi
            done

            if [ "${has_oauth_bootstrap}" -eq 0 ]; then
              echo "missing for live Clover deploy: Clover OAuth bootstrap must be fully configured"
              missing=1
            fi
          fi

          if [ "${missing}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping production deploy because one or more required secrets/variables are missing."
          fi

      - name: Setup SSH key
        if: steps.deploy-check.outputs.enabled == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Copy deployment bundle to server
        if: steps.deploy-check.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          remote_path="${DEPLOY_PATH:-/opt/lattelink-prod}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${remote_path}'"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 -r infra/free/* "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_path}/"

      - name: Deploy compose stack
        if: steps.deploy-check.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          CLIENT_DASHBOARD_DOMAIN: ${{ vars.CLIENT_DASHBOARD_DOMAIN }}
          IMAGE_TAG: ${{ steps.release.outputs.target_sha }}
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
          IMAGE_REGISTRY_PREFIX: ${{ vars.IMAGE_REGISTRY_PREFIX }}
          PASSKEY_RP_ID: ${{ vars.PASSKEY_RP_ID }}
          ALLOW_DEV_CUSTOMER_LOGIN: ${{ vars.ALLOW_DEV_CUSTOMER_LOGIN }}
          CUSTOMER_SESSION_ABSOLUTE_TTL_DAYS: ${{ vars.CUSTOMER_SESSION_ABSOLUTE_TTL_DAYS }}
          OPERATOR_SESSION_ABSOLUTE_TTL_DAYS: ${{ vars.OPERATOR_SESSION_ABSOLUTE_TTL_DAYS }}
          INTERNAL_ADMIN_SESSION_ABSOLUTE_TTL_DAYS: ${{ vars.INTERNAL_ADMIN_SESSION_ABSOLUTE_TTL_DAYS }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          CORS_ALLOWED_ORIGIN_HOST_SUFFIXES: ${{ vars.CORS_ALLOWED_ORIGIN_HOST_SUFFIXES }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_ENV: production
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.EXPECTED_SUPABASE_PROJECT_REF }}
          GATEWAY_INTERNAL_API_TOKEN: ${{ secrets.GATEWAY_INTERNAL_API_TOKEN }}
          ORDERS_INTERNAL_API_TOKEN: ${{ secrets.ORDERS_INTERNAL_API_TOKEN }}
          LOYALTY_INTERNAL_API_TOKEN: ${{ secrets.LOYALTY_INTERNAL_API_TOKEN }}
          NOTIFICATIONS_INTERNAL_API_TOKEN: ${{ secrets.NOTIFICATIONS_INTERNAL_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_ALLOWED_CLIENT_IDS: ${{ vars.APPLE_ALLOWED_CLIENT_IDS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_STATE_SECRET: ${{ secrets.GOOGLE_OAUTH_STATE_SECRET }}
          GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS: ${{ vars.GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS }}
          CATALOG_DEFAULT_LOCATION_ID: ${{ vars.CATALOG_DEFAULT_LOCATION_ID }}
          CATALOG_DEFAULT_BRAND_ID: ${{ vars.CATALOG_DEFAULT_BRAND_ID }}
          CATALOG_DEFAULT_BRAND_NAME: ${{ vars.CATALOG_DEFAULT_BRAND_NAME }}
          CATALOG_DEFAULT_LOCATION_NAME: ${{ vars.CATALOG_DEFAULT_LOCATION_NAME }}
          CATALOG_DEFAULT_MARKET_LABEL: ${{ vars.CATALOG_DEFAULT_MARKET_LABEL }}
          WEBAPP_MENU_SOURCE_URL: ${{ vars.WEBAPP_MENU_SOURCE_URL }}
          MENU_SYNC_LOCATION_ID: ${{ vars.MENU_SYNC_LOCATION_ID }}
          MENU_SYNC_INTERVAL_MS: ${{ vars.MENU_SYNC_INTERVAL_MS }}
          MENU_SYNC_MAX_RETRIES: ${{ vars.MENU_SYNC_MAX_RETRIES }}
          MENU_SYNC_RETRY_DELAY_MS: ${{ vars.MENU_SYNC_RETRY_DELAY_MS }}
          PAYMENTS_PROVIDER_MODE: ${{ vars.PAYMENTS_PROVIDER_MODE }}
          CLOVER_OAUTH_ENVIRONMENT: ${{ vars.CLOVER_OAUTH_ENVIRONMENT }}
          CLOVER_APP_ID: ${{ secrets.CLOVER_APP_ID }}
          CLOVER_APP_SECRET: ${{ secrets.CLOVER_APP_SECRET }}
          CLOVER_OAUTH_REDIRECT_URI: ${{ secrets.CLOVER_OAUTH_REDIRECT_URI }}
          CLOVER_OAUTH_STATE_SECRET: ${{ secrets.CLOVER_OAUTH_STATE_SECRET }}
          CLOVER_WEBHOOK_SHARED_SECRET: ${{ secrets.CLOVER_WEBHOOK_SHARED_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
          CATALOG_MEDIA_R2_ACCOUNT_ID: ${{ vars.CATALOG_MEDIA_R2_ACCOUNT_ID }}
          CATALOG_MEDIA_R2_ACCESS_KEY_ID: ${{ secrets.CATALOG_MEDIA_R2_ACCESS_KEY_ID }}
          CATALOG_MEDIA_R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOG_MEDIA_R2_SECRET_ACCESS_KEY }}
          CATALOG_MEDIA_R2_BUCKET: ${{ vars.CATALOG_MEDIA_R2_BUCKET }}
          CATALOG_MEDIA_PUBLIC_BASE_URL: ${{ vars.CATALOG_MEDIA_PUBLIC_BASE_URL }}
          CATALOG_MEDIA_UPLOAD_MAX_BYTES: ${{ vars.CATALOG_MEDIA_UPLOAD_MAX_BYTES }}
          CATALOG_MEDIA_UPLOAD_EXPIRY_SECONDS: ${{ vars.CATALOG_MEDIA_UPLOAD_EXPIRY_SECONDS }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          remote_path="${DEPLOY_PATH:-/opt/lattelink-prod}"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "export DEPLOY_PATH='${remote_path}' API_DOMAIN='${API_DOMAIN}' CLIENT_DASHBOARD_DOMAIN='${CLIENT_DASHBOARD_DOMAIN}' IMAGE_TAG='${IMAGE_TAG}' APP_VERSION='${APP_VERSION}' LOG_LEVEL='${LOG_LEVEL}' SENTRY_DSN='${SENTRY_DSN}' SENTRY_TRACES_SAMPLE_RATE='${SENTRY_TRACES_SAMPLE_RATE}' IMAGE_REGISTRY_PREFIX='${IMAGE_REGISTRY_PREFIX}' PASSKEY_RP_ID='${PASSKEY_RP_ID}' ALLOW_DEV_CUSTOMER_LOGIN='${ALLOW_DEV_CUSTOMER_LOGIN}' CUSTOMER_SESSION_ABSOLUTE_TTL_DAYS='${CUSTOMER_SESSION_ABSOLUTE_TTL_DAYS}' OPERATOR_SESSION_ABSOLUTE_TTL_DAYS='${OPERATOR_SESSION_ABSOLUTE_TTL_DAYS}' INTERNAL_ADMIN_SESSION_ABSOLUTE_TTL_DAYS='${INTERNAL_ADMIN_SESSION_ABSOLUTE_TTL_DAYS}' CORS_ALLOWED_ORIGINS='${CORS_ALLOWED_ORIGINS}' CORS_ALLOWED_ORIGIN_HOST_SUFFIXES='${CORS_ALLOWED_ORIGIN_HOST_SUFFIXES}' LETSENCRYPT_EMAIL='${LETSENCRYPT_EMAIL}' DATABASE_URL='${DATABASE_URL}' DEPLOY_ENV='${DEPLOY_ENV}' EXPECTED_SUPABASE_PROJECT_REF='${EXPECTED_SUPABASE_PROJECT_REF}' GATEWAY_INTERNAL_API_TOKEN='${GATEWAY_INTERNAL_API_TOKEN}' ORDERS_INTERNAL_API_TOKEN='${ORDERS_INTERNAL_API_TOKEN}' LOYALTY_INTERNAL_API_TOKEN='${LOYALTY_INTERNAL_API_TOKEN}' NOTIFICATIONS_INTERNAL_API_TOKEN='${NOTIFICATIONS_INTERNAL_API_TOKEN}' JWT_SECRET='${JWT_SECRET}' APPLE_TEAM_ID='${APPLE_TEAM_ID}' APPLE_KEY_ID='${APPLE_KEY_ID}' APPLE_PRIVATE_KEY='${APPLE_PRIVATE_KEY}' APPLE_ALLOWED_CLIENT_IDS='${APPLE_ALLOWED_CLIENT_IDS}' GOOGLE_OAUTH_CLIENT_ID='${GOOGLE_OAUTH_CLIENT_ID}' GOOGLE_OAUTH_CLIENT_SECRET='${GOOGLE_OAUTH_CLIENT_SECRET}' GOOGLE_OAUTH_STATE_SECRET='${GOOGLE_OAUTH_STATE_SECRET}' GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS='${GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS}' CATALOG_DEFAULT_LOCATION_ID='${CATALOG_DEFAULT_LOCATION_ID}' CATALOG_DEFAULT_BRAND_ID='${CATALOG_DEFAULT_BRAND_ID}' CATALOG_DEFAULT_BRAND_NAME='${CATALOG_DEFAULT_BRAND_NAME}' CATALOG_DEFAULT_LOCATION_NAME='${CATALOG_DEFAULT_LOCATION_NAME}' CATALOG_DEFAULT_MARKET_LABEL='${CATALOG_DEFAULT_MARKET_LABEL}' WEBAPP_MENU_SOURCE_URL='${WEBAPP_MENU_SOURCE_URL}' MENU_SYNC_LOCATION_ID='${MENU_SYNC_LOCATION_ID}' MENU_SYNC_INTERVAL_MS='${MENU_SYNC_INTERVAL_MS}' MENU_SYNC_MAX_RETRIES='${MENU_SYNC_MAX_RETRIES}' MENU_SYNC_RETRY_DELAY_MS='${MENU_SYNC_RETRY_DELAY_MS}' PAYMENTS_PROVIDER_MODE='${PAYMENTS_PROVIDER_MODE}' CLOVER_OAUTH_ENVIRONMENT='${CLOVER_OAUTH_ENVIRONMENT}' CLOVER_APP_ID='${CLOVER_APP_ID}' CLOVER_APP_SECRET='${CLOVER_APP_SECRET}' CLOVER_OAUTH_REDIRECT_URI='${CLOVER_OAUTH_REDIRECT_URI}' CLOVER_OAUTH_STATE_SECRET='${CLOVER_OAUTH_STATE_SECRET}' CLOVER_WEBHOOK_SHARED_SECRET='${CLOVER_WEBHOOK_SHARED_SECRET}' STRIPE_SECRET_KEY='${STRIPE_SECRET_KEY}' STRIPE_PUBLISHABLE_KEY='${STRIPE_PUBLISHABLE_KEY}' STRIPE_CONNECT_WEBHOOK_SECRET='${STRIPE_CONNECT_WEBHOOK_SECRET}' CATALOG_MEDIA_R2_ACCOUNT_ID='${CATALOG_MEDIA_R2_ACCOUNT_ID}' CATALOG_MEDIA_R2_ACCESS_KEY_ID='${CATALOG_MEDIA_R2_ACCESS_KEY_ID}' CATALOG_MEDIA_R2_SECRET_ACCESS_KEY='${CATALOG_MEDIA_R2_SECRET_ACCESS_KEY}' CATALOG_MEDIA_R2_BUCKET='${CATALOG_MEDIA_R2_BUCKET}' CATALOG_MEDIA_PUBLIC_BASE_URL='${CATALOG_MEDIA_PUBLIC_BASE_URL}' CATALOG_MEDIA_UPLOAD_MAX_BYTES='${CATALOG_MEDIA_UPLOAD_MAX_BYTES}' CATALOG_MEDIA_UPLOAD_EXPIRY_SECONDS='${CATALOG_MEDIA_UPLOAD_EXPIRY_SECONDS}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}'; bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_PATH}"
          if [ -n "${CORS_ALLOWED_ORIGINS:-}" ]; then
            CORS_ALLOWED_ORIGINS_VALUE="${CORS_ALLOWED_ORIGINS}"
          elif [ -n "${CLIENT_DASHBOARD_DOMAIN:-}" ]; then
            CORS_ALLOWED_ORIGINS_VALUE="https://${CLIENT_DASHBOARD_DOMAIN}"
          else
            CORS_ALLOWED_ORIGINS_VALUE="https://${API_DOMAIN}"
          fi

          DATABASE_URL_VALUE="${DATABASE_URL}"
          DEPLOY_ENV_VALUE="${DEPLOY_ENV:-production}"
          EXPECTED_SUPABASE_PROJECT_REF_VALUE="${EXPECTED_SUPABASE_PROJECT_REF}"
          POSTGRES_PASSWORD_VALUE="unused-local-db"
          COMPOSE_PROJECT_NAME_VALUE="${COMPOSE_PROJECT_NAME:-lattelink-prod}"
          PUBLIC_API_BASE_URL_VALUE="https://${API_DOMAIN}/v1"
          APPLE_PRIVATE_KEY_VALUE="${APPLE_PRIVATE_KEY//$'\r'/}"
          APPLE_PRIVATE_KEY_VALUE="${APPLE_PRIVATE_KEY_VALUE//$'\n'/\\n}"
          export DATABASE_URL="${DATABASE_URL_VALUE}"
          export DEPLOY_ENV="${DEPLOY_ENV_VALUE}"
          export EXPECTED_SUPABASE_PROJECT_REF="${EXPECTED_SUPABASE_PROJECT_REF_VALUE}"
          export POSTGRES_PASSWORD="${POSTGRES_PASSWORD_VALUE}"
          export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME_VALUE}"

          cat > .env <<ENVVARS
          API_DOMAIN=${API_DOMAIN}
          CLIENT_DASHBOARD_DOMAIN=${CLIENT_DASHBOARD_DOMAIN}
          LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
          IMAGE_REGISTRY_PREFIX=${IMAGE_REGISTRY_PREFIX}
          IMAGE_TAG=${IMAGE_TAG}
          APP_VERSION=${APP_VERSION:-unknown}
          LOG_LEVEL=${LOG_LEVEL:-info}
          SENTRY_DSN=${SENTRY_DSN}
          SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
          COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME_VALUE}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD_VALUE}
          DATABASE_URL=${DATABASE_URL_VALUE}
          DEPLOY_ENV=${DEPLOY_ENV_VALUE}
          EXPECTED_SUPABASE_PROJECT_REF=${EXPECTED_SUPABASE_PROJECT_REF_VALUE}
          POSTGRES_POOL_BUDGET_LIMIT=60
          POSTGRES_POOL_HEADROOM_MIN=20
          IDENTITY_POSTGRES_POOL_MAX=5
          ORDERS_POSTGRES_POOL_MAX=6
          CATALOG_POSTGRES_POOL_MAX=4
          PAYMENTS_POSTGRES_POOL_MAX=5
          LOYALTY_POSTGRES_POOL_MAX=3
          NOTIFICATIONS_POSTGRES_POOL_MAX=3
          PAYMENT_RECONCILER_POSTGRES_POOL_MAX=1
          GATEWAY_INTERNAL_API_TOKEN=${GATEWAY_INTERNAL_API_TOKEN}
          ORDERS_INTERNAL_API_TOKEN=${ORDERS_INTERNAL_API_TOKEN}
          LOYALTY_INTERNAL_API_TOKEN=${LOYALTY_INTERNAL_API_TOKEN}
          NOTIFICATIONS_INTERNAL_API_TOKEN=${NOTIFICATIONS_INTERNAL_API_TOKEN}
          JWT_SECRET=${JWT_SECRET}
          ALLOW_DEV_CUSTOMER_LOGIN=${ALLOW_DEV_CUSTOMER_LOGIN:-false}
          CUSTOMER_SESSION_ABSOLUTE_TTL_DAYS=${CUSTOMER_SESSION_ABSOLUTE_TTL_DAYS:-90}
          OPERATOR_SESSION_ABSOLUTE_TTL_DAYS=${OPERATOR_SESSION_ABSOLUTE_TTL_DAYS:-30}
          INTERNAL_ADMIN_SESSION_ABSOLUTE_TTL_DAYS=${INTERNAL_ADMIN_SESSION_ABSOLUTE_TTL_DAYS:-14}
          APPLE_TEAM_ID=${APPLE_TEAM_ID}
          APPLE_KEY_ID=${APPLE_KEY_ID}
          APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY_VALUE}
          APPLE_ALLOWED_CLIENT_IDS=${APPLE_ALLOWED_CLIENT_IDS}
          PAYMENTS_PROVIDER_MODE=${PAYMENTS_PROVIDER_MODE:-simulated}
          CLOVER_OAUTH_ENVIRONMENT=${CLOVER_OAUTH_ENVIRONMENT:-sandbox}
          CLOVER_APP_ID=${CLOVER_APP_ID}
          CLOVER_APP_SECRET=${CLOVER_APP_SECRET}
          CLOVER_OAUTH_REDIRECT_URI=${CLOVER_OAUTH_REDIRECT_URI}
          CLOVER_OAUTH_STATE_SECRET=${CLOVER_OAUTH_STATE_SECRET}
          CLOVER_WEBHOOK_SHARED_SECRET=${CLOVER_WEBHOOK_SHARED_SECRET}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
          STRIPE_CONNECT_WEBHOOK_SECRET=${STRIPE_CONNECT_WEBHOOK_SECRET}
          CATALOG_MEDIA_R2_ACCOUNT_ID=${CATALOG_MEDIA_R2_ACCOUNT_ID}
          CATALOG_MEDIA_R2_ACCESS_KEY_ID=${CATALOG_MEDIA_R2_ACCESS_KEY_ID}
          CATALOG_MEDIA_R2_SECRET_ACCESS_KEY=${CATALOG_MEDIA_R2_SECRET_ACCESS_KEY}
          CATALOG_MEDIA_R2_BUCKET=${CATALOG_MEDIA_R2_BUCKET}
          CATALOG_MEDIA_PUBLIC_BASE_URL=${CATALOG_MEDIA_PUBLIC_BASE_URL}
          CATALOG_MEDIA_UPLOAD_MAX_BYTES=${CATALOG_MEDIA_UPLOAD_MAX_BYTES}
          CATALOG_MEDIA_UPLOAD_EXPIRY_SECONDS=${CATALOG_MEDIA_UPLOAD_EXPIRY_SECONDS}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS_VALUE}
          CORS_ALLOWED_ORIGIN_HOST_SUFFIXES=${CORS_ALLOWED_ORIGIN_HOST_SUFFIXES}
          PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL_VALUE}
          PASSKEY_RP_ID=${PASSKEY_RP_ID:-${API_DOMAIN}}
          GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
          GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
          GOOGLE_OAUTH_STATE_SECRET=${GOOGLE_OAUTH_STATE_SECRET}
          GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS=${GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS}
          CATALOG_DEFAULT_LOCATION_ID=${CATALOG_DEFAULT_LOCATION_ID}
          CATALOG_DEFAULT_BRAND_ID=${CATALOG_DEFAULT_BRAND_ID}
          CATALOG_DEFAULT_BRAND_NAME=${CATALOG_DEFAULT_BRAND_NAME}
          CATALOG_DEFAULT_LOCATION_NAME=${CATALOG_DEFAULT_LOCATION_NAME}
          CATALOG_DEFAULT_MARKET_LABEL=${CATALOG_DEFAULT_MARKET_LABEL}
          WEBAPP_MENU_SOURCE_URL=${WEBAPP_MENU_SOURCE_URL}
          MENU_SYNC_LOCATION_ID=${MENU_SYNC_LOCATION_ID}
          MENU_SYNC_INTERVAL_MS=${MENU_SYNC_INTERVAL_MS}
          MENU_SYNC_MAX_RETRIES=${MENU_SYNC_MAX_RETRIES}
          MENU_SYNC_RETRY_DELAY_MS=${MENU_SYNC_RETRY_DELAY_MS}
          ENVVARS

          if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ] && printf '%s' "${IMAGE_REGISTRY_PREFIX}" | grep -q '^ghcr.io/'; then
            printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          fi
          ./bin/deploy-compose.sh .env
          REMOTE

      - name: Smoke check deployed stack
        if: steps.deploy-check.outputs.enabled == 'true'
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          CLIENT_DASHBOARD_DOMAIN: ${{ vars.CLIENT_DASHBOARD_DOMAIN }}
        run: |
          if [ -n "${CLIENT_DASHBOARD_DOMAIN:-}" ]; then
            export CLIENT_DASHBOARD_ORIGIN="https://${CLIENT_DASHBOARD_DOMAIN}"
          fi

          ./infra/free/bin/smoke-check.sh "https://${API_DOMAIN}/v1"

      - name: Skip production deploy (prerequisites missing)
        if: steps.deploy-check.outputs.enabled != 'true'
        run: echo "deploy-prod skipped due to missing required secrets/variables."
