name: deploy-prod
run-name: >-
  deploy-prod
  ${{ github.event_name == 'release' && github.event.release.tag_name || 'rollback' }}
  ${{ github.event_name == 'release' && github.event.release.target_commitish || inputs.source_sha }}

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full published main SHA to roll back production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate production deployment policy
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          APP_VERSION_FALLBACK: ${{ vars.APP_VERSION }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          git fetch --force origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"

          if [ "${EVENT_NAME}" = "release" ]; then
            if [ -z "${RELEASE_TAG:-}" ]; then
              echo "Release event did not include a tag name." >&2
              exit 1
            fi

            target_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            previous_release_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Fxv "${RELEASE_TAG}" | head -n 1 || true)"

            TARGET_SHA="${target_sha}" \
              MAIN_SHA="${main_sha}" \
              PREVIOUS_RELEASE_TAG="${previous_release_tag}" \
              node scripts/validate-production-release.mjs

            {
              echo "release_tag=${RELEASE_TAG}"
              echo "app_version=${RELEASE_TAG#v}"
              echo "target_sha=${target_sha}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s' "${DISPATCH_SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Rollback source_sha must be a full 40-character Git SHA." >&2
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${DISPATCH_SOURCE_SHA}" ]; then
            echo "Checked out ${actual_sha}, but workflow requested ${DISPATCH_SOURCE_SHA}." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${DISPATCH_SOURCE_SHA}" refs/remotes/origin/main; then
            echo "Rollback SHA must already exist on origin/main." >&2
            exit 1
          fi

          {
            echo "release_tag="
            echo "app_version=${APP_VERSION_FALLBACK:-unknown}"
            echo "target_sha=${DISPATCH_SOURCE_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Heroku deployment prerequisites
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.EXPECTED_SUPABASE_PROJECT_REF }}
          GATEWAY_INTERNAL_API_TOKEN: ${{ secrets.GATEWAY_INTERNAL_API_TOKEN }}
          ORDERS_INTERNAL_API_TOKEN: ${{ secrets.ORDERS_INTERNAL_API_TOKEN }}
          LOYALTY_INTERNAL_API_TOKEN: ${{ secrets.LOYALTY_INTERNAL_API_TOKEN }}
          NOTIFICATIONS_INTERNAL_API_TOKEN: ${{ secrets.NOTIFICATIONS_INTERNAL_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APPLE_SIGN_IN_ENABLED: ${{ vars.APPLE_SIGN_IN_ENABLED }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_ALLOWED_CLIENT_IDS: ${{ vars.APPLE_ALLOWED_CLIENT_IDS }}
          PAYMENTS_PROVIDER_MODE: ${{ vars.PAYMENTS_PROVIDER_MODE }}
          CLOVER_APP_ID: ${{ secrets.CLOVER_APP_ID }}
          CLOVER_APP_SECRET: ${{ secrets.CLOVER_APP_SECRET }}
          CLOVER_OAUTH_REDIRECT_URI: ${{ secrets.CLOVER_OAUTH_REDIRECT_URI }}
          CLOVER_OAUTH_STATE_SECRET: ${{ secrets.CLOVER_OAUTH_STATE_SECRET }}
          CLOVER_WEBHOOK_SHARED_SECRET: ${{ secrets.CLOVER_WEBHOOK_SHARED_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          if [ "${DEPLOY_ENABLED:-false}" != "true" ]; then
            echo "Production deployment is disabled by DEPLOY_ENABLED." >&2
            exit 1
          fi

          for required in HEROKU_APP_NAME HEROKU_API_KEY DATABASE_URL EXPECTED_SUPABASE_PROJECT_REF GATEWAY_INTERNAL_API_TOKEN ORDERS_INTERNAL_API_TOKEN LOYALTY_INTERNAL_API_TOKEN NOTIFICATIONS_INTERNAL_API_TOKEN JWT_SECRET STRIPE_SECRET_KEY STRIPE_CONNECT_WEBHOOK_SECRET; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required production deployment setting: ${required}" >&2
              exit 1
            fi
          done

          if ! printf '%s' "${DATABASE_URL}" | grep -Fq "${EXPECTED_SUPABASE_PROJECT_REF}"; then
            echo "Production DATABASE_URL does not match EXPECTED_SUPABASE_PROJECT_REF." >&2
            exit 1
          fi

          if [ "${APPLE_SIGN_IN_ENABLED:-false}" = "true" ]; then
            for required in APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY APPLE_ALLOWED_CLIENT_IDS; do
              if [ -z "${!required:-}" ]; then
                echo "Missing Apple Sign In setting: ${required}" >&2
                exit 1
              fi
            done
          fi

          if [ "${PAYMENTS_PROVIDER_MODE:-simulated}" = "live" ]; then
            for required in CLOVER_APP_ID CLOVER_APP_SECRET CLOVER_OAUTH_REDIRECT_URI CLOVER_OAUTH_STATE_SECRET CLOVER_WEBHOOK_SHARED_SECRET; do
              if [ -z "${!required:-}" ]; then
                echo "Missing live Clover setting: ${required}" >&2
                exit 1
              fi
            done
          fi

      - name: Synchronize Heroku config vars
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          NODE_ENV: production
          DEPLOY_ENV: production
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.EXPECTED_SUPABASE_PROJECT_REF }}
          POSTGRES_CONNECTION_TIMEOUT_MS: "5000"
          POSTGRES_IDLE_TIMEOUT_MS: "10000"
          POSTGRES_POOL_BUDGET_LIMIT: "60"
          POSTGRES_POOL_HEADROOM_MIN: "20"
          IDENTITY_POSTGRES_POOL_MAX: "5"
          ORDERS_POSTGRES_POOL_MAX: "6"
          CATALOG_POSTGRES_POOL_MAX: "4"
          PAYMENTS_POSTGRES_POOL_MAX: "5"
          LOYALTY_POSTGRES_POOL_MAX: "3"
          NOTIFICATIONS_POSTGRES_POOL_MAX: "3"
          PAYMENT_RECONCILER_POSTGRES_POOL_MAX: "1"
          GATEWAY_INTERNAL_API_TOKEN: ${{ secrets.GATEWAY_INTERNAL_API_TOKEN }}
          ORDERS_INTERNAL_API_TOKEN: ${{ secrets.ORDERS_INTERNAL_API_TOKEN }}
          LOYALTY_INTERNAL_API_TOKEN: ${{ secrets.LOYALTY_INTERNAL_API_TOKEN }}
          NOTIFICATIONS_INTERNAL_API_TOKEN: ${{ secrets.NOTIFICATIONS_INTERNAL_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ALLOW_DEV_CUSTOMER_LOGIN: "false"
          ALLOW_DEV_OPERATOR_LOGIN: "false"
          CUSTOMER_SESSION_ABSOLUTE_TTL_DAYS: ${{ vars.CUSTOMER_SESSION_ABSOLUTE_TTL_DAYS || '90' }}
          OPERATOR_SESSION_ABSOLUTE_TTL_DAYS: ${{ vars.OPERATOR_SESSION_ABSOLUTE_TTL_DAYS || '30' }}
          INTERNAL_ADMIN_SESSION_ABSOLUTE_TTL_DAYS: ${{ vars.INTERNAL_ADMIN_SESSION_ABSOLUTE_TTL_DAYS || '14' }}
          CLIENT_DASHBOARD_DOMAIN: ${{ vars.CLIENT_DASHBOARD_DOMAIN }}
          CLIENT_DASHBOARD_BASE_URL: https://${{ vars.CLIENT_DASHBOARD_DOMAIN }}
          ADMIN_CONSOLE_CLIENT_DASHBOARD_URL: https://${{ vars.CLIENT_DASHBOARD_DOMAIN }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          PUBLIC_API_BASE_URL: https://${{ vars.API_DOMAIN }}/v1
          PASSKEY_RP_ID: ${{ vars.PASSKEY_RP_ID }}
          PASSKEY_RP_NAME: Nomly
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_ALLOWED_CLIENT_IDS: ${{ vars.APPLE_ALLOWED_CLIENT_IDS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_STATE_SECRET: ${{ secrets.GOOGLE_OAUTH_STATE_SECRET }}
          GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS: ${{ vars.GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'console' }}
          OWNER_INVITE_EMAIL_FROM: ${{ vars.OWNER_INVITE_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PAYMENTS_PROVIDER_MODE: ${{ vars.PAYMENTS_PROVIDER_MODE || 'live' }}
          CLOVER_OAUTH_ENVIRONMENT: ${{ vars.CLOVER_OAUTH_ENVIRONMENT || 'production' }}
          CLOVER_APP_ID: ${{ secrets.CLOVER_APP_ID }}
          CLOVER_APP_SECRET: ${{ secrets.CLOVER_APP_SECRET }}
          CLOVER_OAUTH_REDIRECT_URI: ${{ secrets.CLOVER_OAUTH_REDIRECT_URI }}
          CLOVER_OAUTH_STATE_SECRET: ${{ secrets.CLOVER_OAUTH_STATE_SECRET }}
          CLOVER_WEBHOOK_SHARED_SECRET: ${{ secrets.CLOVER_WEBHOOK_SHARED_SECRET }}
          CLOVER_ORDER_TYPE_ID: ${{ vars.CLOVER_ORDER_TYPE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
          NOTIFICATIONS_PROVIDER_MODE: expo
          EXPO_PUSH_API_URL: ${{ vars.EXPO_PUSH_API_URL }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          ORDER_FULFILLMENT_MODE: staff
          CATALOG_DEFAULT_LOCATION_ID: ${{ vars.CATALOG_DEFAULT_LOCATION_ID }}
          CATALOG_DEFAULT_BRAND_ID: ${{ vars.CATALOG_DEFAULT_BRAND_ID }}
          CATALOG_DEFAULT_BRAND_NAME: ${{ vars.CATALOG_DEFAULT_BRAND_NAME }}
          CATALOG_DEFAULT_LOCATION_NAME: ${{ vars.CATALOG_DEFAULT_LOCATION_NAME }}
          CATALOG_DEFAULT_MARKET_LABEL: ${{ vars.CATALOG_DEFAULT_MARKET_LABEL }}
          CATALOG_MEDIA_R2_ACCOUNT_ID: ${{ vars.CATALOG_MEDIA_R2_ACCOUNT_ID }}
          CATALOG_MEDIA_R2_ACCESS_KEY_ID: ${{ secrets.CATALOG_MEDIA_R2_ACCESS_KEY_ID }}
          CATALOG_MEDIA_R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOG_MEDIA_R2_SECRET_ACCESS_KEY }}
          CATALOG_MEDIA_R2_BUCKET: ${{ vars.CATALOG_MEDIA_R2_BUCKET }}
          CATALOG_MEDIA_PUBLIC_BASE_URL: ${{ vars.CATALOG_MEDIA_PUBLIC_BASE_URL }}
          CATALOG_MEDIA_UPLOAD_MAX_BYTES: ${{ vars.CATALOG_MEDIA_UPLOAD_MAX_BYTES || '10485760' }}
          CATALOG_MEDIA_UPLOAD_EXPIRY_SECONDS: ${{ vars.CATALOG_MEDIA_UPLOAD_EXPIRY_SECONDS || '300' }}
          WEBAPP_MENU_SOURCE_URL: ${{ vars.WEBAPP_MENU_SOURCE_URL }}
          MENU_SYNC_LOCATION_ID: ${{ vars.MENU_SYNC_LOCATION_ID }}
          MENU_SYNC_INTERVAL_MS: ${{ vars.MENU_SYNC_INTERVAL_MS || '300000' }}
          MENU_SYNC_MAX_RETRIES: ${{ vars.MENU_SYNC_MAX_RETRIES || '3' }}
          MENU_SYNC_RETRY_DELAY_MS: ${{ vars.MENU_SYNC_RETRY_DELAY_MS || '2000' }}
          MENU_SYNC_DEAD_LETTER_PATH: /tmp/nomly-menu-sync.jsonl
          NOTIFICATIONS_DISPATCH_INTERVAL_MS: "5000"
          NOTIFICATIONS_DISPATCH_BATCH_SIZE: "50"
          PAYMENT_RECONCILER_ENABLED: "true"
          PAYMENT_RECONCILER_INTERVAL_MS: "300000"
          PAYMENT_RECONCILER_STALE_THRESHOLD_MS: "600000"
          PAYMENT_RECONCILER_BATCH_SIZE: "50"
        run: node scripts/heroku-sync-config.mjs

      - name: Deploy released source to Heroku
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -euo pipefail
          trap 'rm -f "$HOME/.git-credentials"' EXIT
          git config --global credential.helper store
          printf 'https://heroku:%s@git.heroku.com\n' "${HEROKU_API_KEY}" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git push --force "https://git.heroku.com/${HEROKU_APP_NAME}.git" "${TARGET_SHA}:refs/heads/main"

      - name: Wait for the production API
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "https://${API_DOMAIN}/health" > /dev/null; then
              exit 0
            fi
            echo "Waiting for production API (${attempt}/30)..."
            sleep 5
          done
          echo "Production API did not become healthy." >&2
          exit 1

      - name: Smoke check deployed stack
        env:
          CLIENT_DASHBOARD_ORIGIN: https://${{ vars.CLIENT_DASHBOARD_DOMAIN }}
        run: ./infra/free/bin/smoke-check.sh "https://${{ vars.API_DOMAIN }}/v1"
