name: admin-console-vercel

on:
  release:
    types:
      - published
  pull_request:
    paths:
      - "apps/admin-console/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/admin-console-vercel.yml"

permissions:
  contents: read

concurrency:
  group: admin-console-vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.ADMIN_CONSOLE_VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.ADMIN_CONSOLE_VERCEL_PROJECT_ID }}
  VERCEL_WORKING_DIR: apps/admin-console

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck --filter=@lattelink/admin-console
      - run: pnpm exec turbo run lint --filter=@lattelink/admin-console
      - run: pnpm exec turbo run build --filter=@lattelink/admin-console

  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - name: Check Vercel preview deploy prerequisites
        id: preview-check
        env:
          VERCEL_TOKEN: ${{ secrets.ADMIN_CONSOLE_VERCEL_TOKEN }}
          ADMIN_CONSOLE_ENV: ${{ secrets.ADMIN_CONSOLE_VERCEL_PREVIEW_ENV }}
        run: |
          missing=0
          for required in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID ADMIN_CONSOLE_ENV; do
            if [ -z "${!required}" ]; then
              echo "missing: ${required}"
              missing=1
            fi
          done

          if [ "${missing}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Vercel preview deploy because one or more required secrets are missing."
          fi
      - uses: actions/setup-node@v6
        if: steps.preview-check.outputs.enabled == 'true'
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        if: steps.preview-check.outputs.enabled == 'true'
      - name: Install Vercel CLI
        if: steps.preview-check.outputs.enabled == 'true'
        run: npm install --global vercel@latest
      - name: Write admin console preview env files
        if: steps.preview-check.outputs.enabled == 'true'
        working-directory: ${{ env.VERCEL_WORKING_DIR }}
        env:
          ADMIN_CONSOLE_ENV: ${{ secrets.ADMIN_CONSOLE_VERCEL_PREVIEW_ENV }}
        run: |
          printf '%s\n' "${ADMIN_CONSOLE_ENV}" > .env.local
          printf '%s\n' "${ADMIN_CONSOLE_ENV}" > .env.production.local
      - name: Pull Vercel preview configuration
        if: steps.preview-check.outputs.enabled == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.ADMIN_CONSOLE_VERCEL_TOKEN }}
      - name: Build admin console preview artifacts for Vercel
        if: steps.preview-check.outputs.enabled == 'true'
        run: vercel build --token=${{ secrets.ADMIN_CONSOLE_VERCEL_TOKEN }}
      - name: Deploy admin console preview to Vercel
        if: steps.preview-check.outputs.enabled == 'true'
        run: vercel deploy --prebuilt --token=${{ secrets.ADMIN_CONSOLE_VERCEL_TOKEN }}
      - name: Remove admin console env files
        if: always()
        working-directory: ${{ env.VERCEL_WORKING_DIR }}
        run: rm -f .env.local .env.production.local
      - name: Skip Vercel preview deploy
        if: steps.preview-check.outputs.enabled != 'true'
        run: echo "Preview deploy skipped until ADMIN_CONSOLE_VERCEL_TOKEN, ADMIN_CONSOLE_VERCEL_ORG_ID, ADMIN_CONSOLE_VERCEL_PROJECT_ID, and ADMIN_CONSOLE_VERCEL_PREVIEW_ENV are configured."

  deploy-production:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate published production release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          git fetch --force origin main:refs/remotes/origin/main

          target_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          previous_release_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Fxv "${RELEASE_TAG}" | head -n 1 || true)"

          TARGET_SHA="${target_sha}" \
            MAIN_SHA="${main_sha}" \
            PREVIOUS_RELEASE_TAG="${previous_release_tag}" \
            node scripts/validate-production-release.mjs
      - name: Check Vercel production deploy prerequisites
        id: production-check
        env:
          VERCEL_TOKEN: ${{ secrets.ADMIN_CONSOLE_VERCEL_TOKEN }}
          ADMIN_CONSOLE_ENV: ${{ secrets.ADMIN_CONSOLE_VERCEL_PRODUCTION_ENV }}
        run: |
          missing=0
          for required in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID ADMIN_CONSOLE_ENV; do
            if [ -z "${!required}" ]; then
              echo "missing: ${required}"
              missing=1
            fi
          done

          if [ "${missing}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Vercel production deploy because one or more required secrets are missing."
          fi
      - uses: pnpm/action-setup@v6
        if: steps.production-check.outputs.enabled == 'true'
      - name: Install Vercel CLI
        if: steps.production-check.outputs.enabled == 'true'
        run: npm install --global vercel@latest
      - name: Write admin console production env files
        if: steps.production-check.outputs.enabled == 'true'
        working-directory: ${{ env.VERCEL_WORKING_DIR }}
        env:
          ADMIN_CONSOLE_ENV: ${{ secrets.ADMIN_CONSOLE_VERCEL_PRODUCTION_ENV }}
        run: |
          printf '%s\n' "${ADMIN_CONSOLE_ENV}" > .env.local
          printf '%s\n' "${ADMIN_CONSOLE_ENV}" > .env.production.local
      - name: Pull Vercel production configuration
        if: steps.production-check.outputs.enabled == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.ADMIN_CONSOLE_VERCEL_TOKEN }}
      - name: Build admin console production artifacts for Vercel
        if: steps.production-check.outputs.enabled == 'true'
        run: vercel build --prod --token=${{ secrets.ADMIN_CONSOLE_VERCEL_TOKEN }}
      - name: Deploy admin console production to Vercel
        if: steps.production-check.outputs.enabled == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.ADMIN_CONSOLE_VERCEL_TOKEN }}
      - name: Remove admin console env files
        if: always()
        working-directory: ${{ env.VERCEL_WORKING_DIR }}
        run: rm -f .env.local .env.production.local
      - name: Skip Vercel production deploy
        if: steps.production-check.outputs.enabled != 'true'
        run: echo "Production deploy skipped until ADMIN_CONSOLE_VERCEL_TOKEN, ADMIN_CONSOLE_VERCEL_ORG_ID, ADMIN_CONSOLE_VERCEL_PROJECT_ID, and ADMIN_CONSOLE_VERCEL_PRODUCTION_ENV are configured."
