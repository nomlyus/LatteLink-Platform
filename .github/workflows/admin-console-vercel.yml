name: admin-console-vercel

on:
  release:
    types:
      - published
  pull_request:
    paths:
      - "apps/admin-console/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/admin-console-vercel.yml"

permissions:
  contents: read

concurrency:
  group: admin-console-vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_WORKING_DIR: apps/admin-console

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck --filter=@lattelink/admin-console
      - run: pnpm exec turbo run lint --filter=@lattelink/admin-console
      - run: pnpm exec turbo run build --filter=@lattelink/admin-console
