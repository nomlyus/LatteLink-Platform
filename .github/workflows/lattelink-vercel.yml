name: lattelink-vercel

on:
  push:
    branches:
      - develop
    paths:
      - "apps/lattelink-web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/lattelink-vercel.yml"
  release:
    types:
      - published
  pull_request:
    paths:
      - "apps/lattelink-web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/lattelink-vercel.yml"

permissions:
  contents: read

concurrency:
  group: lattelink-vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.LATTELINK_VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.LATTELINK_VERCEL_PROJECT_ID }}
  VERCEL_WORKING_DIR: apps/lattelink-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @lattelink/web typecheck
      - run: pnpm --filter @lattelink/web build

  deploy-preview:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: verify
    env:
      NEXT_PUBLIC_CLIENT_DASHBOARD_URL: https://app-dev.nomly.us
    steps:
      - uses: actions/checkout@v5
      - name: Check Vercel preview deploy prerequisites
        id: preview-check
        env:
          VERCEL_TOKEN: ${{ secrets.LATTELINK_VERCEL_TOKEN }}
        run: |
          missing=0
          for required in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!required}" ]; then
              echo "missing: ${required}"
              missing=1
            fi
          done

          if [ "${missing}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Vercel preview deploy because one or more required secrets are missing."
          fi
      - uses: actions/setup-node@v6
        if: steps.preview-check.outputs.enabled == 'true'
        with:
          node-version: 22
      - name: Install Vercel CLI
        if: steps.preview-check.outputs.enabled == 'true'
        run: npm install --global vercel@latest
      - name: Pull Vercel preview configuration
        if: steps.preview-check.outputs.enabled == 'true'
        run: vercel pull --yes --environment=preview --cwd "${VERCEL_WORKING_DIR}" --token=${{ secrets.LATTELINK_VERCEL_TOKEN }}
      - name: Validate LatteLink preview env
        if: steps.preview-check.outputs.enabled == 'true'
        working-directory: ${{ env.VERCEL_WORKING_DIR }}
        run: pnpm release:check preview .vercel/.env.preview.local
      - name: Build LatteLink preview artifacts for Vercel
        if: steps.preview-check.outputs.enabled == 'true'
        run: vercel build --cwd "${VERCEL_WORKING_DIR}" --token=${{ secrets.LATTELINK_VERCEL_TOKEN }}
      - name: Deploy LatteLink preview to Vercel
        if: steps.preview-check.outputs.enabled == 'true'
        run: vercel deploy --prebuilt --cwd "${VERCEL_WORKING_DIR}" --token=${{ secrets.LATTELINK_VERCEL_TOKEN }}
      - name: Skip Vercel preview deploy
        if: steps.preview-check.outputs.enabled != 'true'
        run: echo "Preview deploy skipped until LATTELINK_VERCEL_TOKEN, LATTELINK_VERCEL_ORG_ID, and LATTELINK_VERCEL_PROJECT_ID are configured."

  deploy-production:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate published production release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          git fetch --force origin main:refs/remotes/origin/main

          target_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          previous_release_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Fxv "${RELEASE_TAG}" | head -n 1 || true)"

          TARGET_SHA="${target_sha}" \
            MAIN_SHA="${main_sha}" \
            PREVIOUS_RELEASE_TAG="${previous_release_tag}" \
            node scripts/validate-production-release.mjs
      - name: Check Vercel production deploy prerequisites
        id: production-check
        env:
          VERCEL_TOKEN: ${{ secrets.LATTELINK_VERCEL_TOKEN }}
        run: |
          missing=0
          for required in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!required}" ]; then
              echo "missing: ${required}"
              missing=1
            fi
          done

          if [ "${missing}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Vercel production deploy because one or more required secrets are missing."
          fi
      - name: Install Vercel CLI
        if: steps.production-check.outputs.enabled == 'true'
        run: npm install --global vercel@latest
      - name: Pull Vercel production configuration
        if: steps.production-check.outputs.enabled == 'true'
        run: vercel pull --yes --environment=production --cwd "${VERCEL_WORKING_DIR}" --token=${{ secrets.LATTELINK_VERCEL_TOKEN }}
      - name: Validate LatteLink production env
        if: steps.production-check.outputs.enabled == 'true'
        working-directory: ${{ env.VERCEL_WORKING_DIR }}
        run: pnpm release:check production .vercel/.env.production.local
      - name: Build LatteLink production artifacts for Vercel
        if: steps.production-check.outputs.enabled == 'true'
        run: vercel build --prod --cwd "${VERCEL_WORKING_DIR}" --token=${{ secrets.LATTELINK_VERCEL_TOKEN }}
      - name: Deploy LatteLink production to Vercel
        if: steps.production-check.outputs.enabled == 'true'
        run: vercel deploy --prebuilt --prod --cwd "${VERCEL_WORKING_DIR}" --token=${{ secrets.LATTELINK_VERCEL_TOKEN }}
      - name: Skip Vercel production deploy
        if: steps.production-check.outputs.enabled != 'true'
        run: echo "Production deploy skipped until LATTELINK_VERCEL_TOKEN, LATTELINK_VERCEL_ORG_ID, and LATTELINK_VERCEL_PROJECT_ID are configured."
